<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>youtube-dl Downloader Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div id="app">
    <h1>Backend connection</h1>
    <p class="hint">
      Run <code>python browser-extension/backend/server.py</code> from the
      repo, then copy the auth token it prints (or the contents of
      <code>browser-extension/backend/token.txt</code>) below.
    </p>

    <label for="backendUrl">Backend URL</label>
    <input type="url" id="backendUrl" placeholder="http://127.0.0.1:4325">

    <label for="token">Auth token</label>
    <input type="text" id="token" placeholder="paste token here">

    <button id="save">Save</button>
    <span id="status"></span>
  </div>

  <script src="options.js"></script>
</body>
</html>
