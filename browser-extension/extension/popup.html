<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>youtube-dl Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <span class="brand">Downloader</span>
      <button id="settings-toggle" class="icon-btn" type="button" title="Settings" aria-label="Settings">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <circle cx="8" cy="8" r="2.2"/>
          <path d="M8 1.5v1.6M8 12.9v1.6M14.5 8h-1.6M3.1 8H1.5M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7 3.6 3.6"/>
        </svg>
      </button>
    </header>

    <div id="settings-panel" class="hidden">
      <label for="download-dir">Download location</label>
      <input type="text" id="download-dir" placeholder="C:\Users\you\Downloads\youtube-dl-extension">
      <div class="settings-row">
        <button id="save-settings" type="button">Save</button>
        <span id="settings-status"></span>
      </div>
    </div>

    <div id="message"></div>

    <div id="video-info" class="hidden">
      <img id="thumb" class="hidden" alt="">
      <input type="text" id="title" aria-label="Filename">

      <div class="format-row">
        <label><input type="radio" name="mode" value="mp4" checked><span>MP4</span></label>
        <select id="mp4-quality"></select>
      </div>
      <div class="format-row">
        <label><input type="radio" name="mode" value="mp3"><span>MP3</span></label>
        <select id="mp3-quality"></select>
      </div>
      <div class="format-row">
        <label><input type="radio" name="mode" value="wav"><span>WAV</span></label>
        <span class="hint">lossless</span>
      </div>

      <button id="download">Download</button>

      <div id="progress-wrap" class="hidden">
        <div id="progress-track"><div id="progress-bar"></div></div>
        <div id="progress-text"></div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
